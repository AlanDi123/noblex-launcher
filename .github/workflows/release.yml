name: Signed Android Release

# Runs only for deliberate semantic-version tags (vMAJOR.MINOR.PATCH or -alpha.N/-beta.N/-rc.N).
# Pre-release tags create GitHub pre-releases, which the in-app updater ignores.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4.0.4
      - uses: gradle/actions/setup-gradle@v4
      - name: Require signing secrets and pinned certificate
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD CERT_SHA256; do
            if [ -z "${!name}" ]; then echo "Missing required secret or variable: $name" >&2; exit 1; fi
          done
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Decode signing key outside the checkout
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/noblex-release.jks"
      - name: Test and build signed release
        env:
          NOBLEX_KEYSTORE_PATH: ${{ runner.temp }}/noblex-release.jks
          NOBLEX_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NOBLEX_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NOBLEX_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew --no-daemon testDebugUnitTest lint assembleRelease -PversionName="$VERSION"
      - name: Verify APK against the pinned certificate and create assets
        env:
          CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SRC="app/build/outputs/apk/release/app-release.apk"
          APK="noblex-launcher-${VERSION}.apk"
          cp "$SRC" "$APK"
          export ANDROID_HOME
          scripts/verify_apk.sh "$APK" "$CERT_SHA256"
          python3 - "$VERSION" > release-notes.md <<'PY'
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(rf"^## {re.escape(version)}\b.*?(?=^## |\Z)", text, re.M | re.S)
          if not match:
              raise SystemExit(f"CHANGELOG.md has no section for {version}.")
          print(match.group(0).strip())
          PY
          python3 scripts/make_update_manifest.py "$APK" \
            --aapt2 "$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --notes release-notes.md
          sha256sum "$APK" > "$APK.sha256"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          RELEASE_ARGS=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then RELEASE_ARGS+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${RELEASE_ARGS[@]}" \
            --title "NOBLEX LAUNCHER ${VERSION}" \
            --notes-file release-notes.md \
            "noblex-launcher-${VERSION}.apk" "noblex-launcher-${VERSION}.apk.sha256" update-manifest.json
